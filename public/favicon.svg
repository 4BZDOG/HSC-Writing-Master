<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    The brand mark (components/BandLadderMark.tsx) at tab size: the six band
    colours as six equal rungs on the ink tile, rung 6 taller, and the caret
    above it. The rung colours are BAND_HEX in utils/renderUtils.ts. This file is
    static and is not built from that module, so the six values are written out
    here; if the palette changes there, change them here too. It is the one place
    a colour literal is unavoidable.
  -->
  <rect width="64" height="64" rx="20" fill="#0f172a"/>
  <!-- Rungs 1 to 5: 6 units wide, 2.4 apart, 16 tall, bottom at y=55. -->
  <rect x="8" y="39" width="6" height="16" fill="#ef4444"/>
  <rect x="16.4" y="39" width="6" height="16" fill="#f97316"/>
  <rect x="24.8" y="39" width="6" height="16" fill="#eab308"/>
  <rect x="33.2" y="39" width="6" height="16" fill="#22c55e"/>
  <rect x="41.6" y="39" width="6" height="16" fill="#3b82f6"/>
  <!-- Rung 6: the same rung at 1.8 times the height, the lit rung of the marking glyph. -->
  <rect x="50" y="26" width="6" height="29" fill="#a855f7"/>
  <!-- The caret: the marking glyph's teardrop, 12 by 14, centred over rung 6 (x=53). -->
  <g transform="translate(47 8) scale(0.857 0.875)">
    <path d="M7 16 L1 5 A6 6 0 1 1 13 5 Z" fill="#ffffff"/>
    <circle cx="7" cy="5.5" r="2.2" fill="#a855f7"/>
  </g>
</svg>
