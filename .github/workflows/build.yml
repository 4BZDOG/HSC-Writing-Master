name: Build & Test

on:
  push:
    branches: [main, develop, claude/*]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run type-check

      # Flags a new module-init read of an imported value — the pattern behind
      # "Cannot access 'X' before initialization". Source-level, so it catches
      # the landmine before the bundler decides whether it detonates.
      - name: Check for eager module-init reads
        run: npm run check:eager-reads

  build:
    name: Build Project
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      # Catches "Cannot access 'X' before initialization" — a top-level read of
      # an imported binding across a circular chunk import. Invisible to dev,
      # to `vite build` and to the unit tests; renders a blank page in
      # production. See scripts/checkChunkInitOrder.mjs.
      - name: Check chunk initialisation order
        run: npm run check:bundle

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 5

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npm run test -- --run

      - name: Generate coverage
        run: npm run test:coverage -- --run

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false

  rls:
    name: RLS Policy Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # Applies the Supabase compat shim, the real schema.sql, the test grants,
      # then the RLS negative tests and the entitlement tests. ON_ERROR_STOP
      # makes a regressed policy or trigger (a privileged action that
      # unexpectedly succeeds) fail the job.
      - name: Apply schema and run RLS negative tests
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/ci/01_shim.sql
          psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/ci/02_grants.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rls_negative_tests.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/entitlement_tests.sql

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Check for known vulnerabilities
        run: npm audit --audit-level=moderate || true

  # Netlify production deploy. Like the Vercel workflow, this skips cleanly
  # when its secrets are absent — but it says so out loud. Without the explicit
  # check below, nwtgck/actions-netlify prints "Netlify credentials not
  # provided, not deployable" deep in the log and exits 0, so the job reports a
  # green "Deploy to Production" having deployed nothing at all.
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, test, rls, e2e, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Check Netlify secrets
        id: netlify
        run: |
          if [ -z "${{ secrets.NETLIFY_AUTH_TOKEN }}" ] || [ -z "${{ secrets.NETLIFY_SITE_ID }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Netlify secrets not configured (NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID) — nothing was deployed to Netlify. GitHub Pages remains the active deployment; see DEPLOYMENT.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.netlify.outputs.configured == 'true'

      - uses: actions/setup-node@v4
        if: steps.netlify.outputs.configured == 'true'
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps
        if: steps.netlify.outputs.configured == 'true'

      - name: Build
        if: steps.netlify.outputs.configured == 'true'
        run: npm run build

      - name: Deploy to Netlify
        if: steps.netlify.outputs.configured == 'true'
        uses: nwtgck/actions-netlify@v2.0
        with:
          publish-dir: './dist'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: 'Production deployment from ${{ github.sha }}'
          enable-pull-request-comment: true
          enable-commit-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
