name: Build & Test

on:
  # Feature branches are deliberately NOT listed here.
  #
  # `claude/*` used to be a push trigger as well, so a branch with an open pull
  # request ran this entire pipeline TWICE for every commit — two lint jobs, two
  # builds, two RLS runs and, worst of all, two full E2E matrices for the same
  # SHA. That is a straight doubling of the wall-clock cost of exactly the
  # moment it hurts most: pushing a fix and waiting to merge. A feature branch
  # now gets its checks through its pull request, which is where the result is
  # read anyway.
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Superseded runs are cancelled rather than left to finish. Pushing three fixes
# in quick succession used to queue three complete pipelines, and on a runner
# pool of any size the queue is the wait.
#
# `main` is excluded from cancellation: those runs gate the deploy, so the last
# green commit must actually be verified rather than cancelled by the next push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run type-check

      # Flags a new module-init read of an imported value — the pattern behind
      # "Cannot access 'X' before initialization". Source-level, so it catches
      # the landmine before the bundler decides whether it detonates.
      - name: Check for eager module-init reads
        run: npm run check:eager-reads

  build:
    name: Build Project
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      # Catches "Cannot access 'X' before initialization" — a top-level read of
      # an imported binding across a circular chunk import. Invisible to dev,
      # to `vite build` and to the unit tests; renders a blank page in
      # production. See scripts/checkChunkInitOrder.mjs.
      - name: Check chunk initialisation order
        run: npm run check:bundle

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 5

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      # One pass, not two. This job used to run the whole suite, then run it
      # again under coverage — the second run repeats every test the first one
      # just executed. `--coverage` reports the failures either way, so the
      # first pass bought nothing but its own runtime.
      - name: Run tests with coverage
        run: npm run test:coverage -- --run

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false

  rls:
    name: RLS Policy Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # Applies the Supabase compat shim, the real schema.sql, the test grants,
      # then the RLS negative tests and the entitlement tests. ON_ERROR_STOP
      # makes a regressed policy or trigger (a privileged action that
      # unexpectedly succeeds) fail the job.
      - name: Apply schema and run RLS negative tests
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/ci/01_shim.sql
          psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/ci/02_grants.sql

          # schema.sql is documented as safe to re-run, so a second apply must
          # not MUTATE data. Arm a private, unowned row; re-apply; assert it was
          # not silently published. This cannot live in the SQL test files —
          # they cannot re-run the schema themselves.
          psql -v ON_ERROR_STOP=1 -f supabase/tests/ci/03_reapply_guard.sql
          psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql -v ON_ERROR_STOP=1 -v check=1 -f supabase/tests/ci/03_reapply_guard.sql

          psql -v ON_ERROR_STOP=1 -f supabase/tests/rls_negative_tests.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/entitlement_tests.sql

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      # The Playwright version as actually installed, so the cache key below
      # changes exactly when the browser build it pins would.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # The browsers are ~1.3GB unpacked (Chromium alone is ~900MB) and were
      # downloaded and unpacked from scratch on every single run — a minute or
      # more before a test could start. The key carries the engine set as well
      # as the version, so a pull request's two-engine cache and main's
      # full-matrix cache never overwrite one another.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ github.event_name == 'pull_request' && 'pr' || 'full' }}

      # Only the engines the matrix below will actually launch: Mobile Safari
      # is WebKit, so a pull request needs no Firefox download either.
      #
      # On a cache hit only the OS-level shared libraries are installed
      # (--only-shell is not enough — those live outside the cached directory
      # and are what a cold runner is missing).
      - name: Install Playwright browsers
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ENGINES="chromium webkit"
          else
            ENGINES=""
          fi
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps $ENGINES
          else
            npx playwright install --with-deps $ENGINES
          fi

      # Pull requests run the trimmed matrix (Chromium + Mobile Safari, plus
      # the Supabase project) so a review round costs ~2 minutes instead of
      # ~6. Pushes to main run all five browsers, so nothing ships without
      # Firefox, desktop WebKit and Mobile Chrome having seen it.
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          PW_FAST: ${{ github.event_name == 'pull_request' && '1' || '' }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Check for known vulnerabilities
        run: npm audit --audit-level=moderate || true

  # Netlify production deploy. Like the Vercel workflow, this skips cleanly
  # when its secrets are absent — but it says so out loud. Without the explicit
  # check below, nwtgck/actions-netlify prints "Netlify credentials not
  # provided, not deployable" deep in the log and exits 0, so the job reports a
  # green "Deploy to Production" having deployed nothing at all.
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, test, rls, e2e, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Check Netlify secrets
        id: netlify
        run: |
          if [ -z "${{ secrets.NETLIFY_AUTH_TOKEN }}" ] || [ -z "${{ secrets.NETLIFY_SITE_ID }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Netlify secrets not configured (NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID) — nothing was deployed to Netlify. GitHub Pages remains the active deployment; see DEPLOYMENT.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.netlify.outputs.configured == 'true'

      - uses: actions/setup-node@v4
        if: steps.netlify.outputs.configured == 'true'
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps
        if: steps.netlify.outputs.configured == 'true'

      - name: Build
        if: steps.netlify.outputs.configured == 'true'
        run: npm run build

      - name: Deploy to Netlify
        if: steps.netlify.outputs.configured == 'true'
        uses: nwtgck/actions-netlify@v2.0
        with:
          publish-dir: './dist'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: 'Production deployment from ${{ github.sha }}'
          enable-pull-request-comment: true
          enable-commit-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
