[]},"content":{"images":[],"linkedItemCodenames":[],"linkedItems":[],"links":[{"codename":"glo_link__glb__aboriginal_and_torres_strait_island","linkId":"29f68caa-2b19-42e1-bda1-96417d869611","urlSlug":"","type":"link_glossary"},{"codename":"glo_link__glb__diversity","linkId":"a88b1cf3-6ba1-4025-ab2c-3116145172f9","urlSlug":"","type":"link_glossary"},{"codename":"glo_link__en__culture","linkId":"a18e913f-8e09-47e3-8427-b4f270af9016","urlSlug":"","type":"link_glossary"}],"name":"📜 Content","type":"rich_text","value":"<p>Through the study of texts in this focus area, students develop their understanding of the diverse communities, cultural identities and groups in contemporary and historical Australia. Students broaden their understanding of the relationships between personal identity, individual rights and community responsibilities, and develop a sense of Australia’s place in the modern world and its likely place in the future. Through engagement with texts by and about <a data-item-id=\"29f68caa-2b19-42e1-bda1-96417d869611\" href=\"\">Aboriginal and/or Torres Strait Islander Peoples<\/a>, and texts composed by migrant and refugee Australians, students deepen their understanding of the <a data-item-id=\"a88b1cf3-6ba1-4025-ab2c-3116145172f9\" href=\"\">diversity<\/a> of <a data-item-id=\"a18e913f-8e09-47e3-8427-b4f270af9016\" href=\"\">cultures<\/a>, peoples, perspectives and voices that contribute to Australian society.<\/p>\n<p>Students engage with a range of literary and everyday texts that represent a diversity of Australian cultures, peoples, perspectives and voices to develop their awareness and understanding of issues around citizenship, community and cultural identity. Through the exploration of texts such as novels, nonfiction prose, poetry and film, students investigate the ways language is used to represent issues and attitudes, and influence and engage different audiences. They develop skills in accessing and comprehending information that will enable them to have increasingly informed views on matters of public interest and to express those views.<\/p>"},"title":{"name":"📜 Title","type":"text","value":"Elective A: Voices of Australia"},"prescriptions":{"name":"📖 Prescriptions","type":"modular_content","value":[],"linkedItems":[]}}},"cg1d8f2c35":{"system":{"codename":"cg1d8f2c35","collection":"default","id":"cfb50a80-7c64-4b41-9543-5761590d9dc5","language":"default","lastModified":"2024-09-26T01:46:32.8868676Z","name":"MS S6 Y11 Responding","sitemapLocations":[],"type":"contentgroup","workflowStep":"published"},"elements":{"content":{"images":[],"linkedItemCodenames":[],"linkedItems":[],"links":[],"name":"📜 Content","type":"rich_text","value":"<p><br><\/p>"},"title":{"name":"📜 Title","type":"text","value":"Responding"},"code":{"name":"📜 Code","type":"text","value":""},"content_items":{"name":"📄 Content Items","type":"modular_content","value":["ms_s6_y11_compose_a_variety_of_texts_that_use_lang","ms_s6_y11_compose_critical_texts_that_use_appropri","ms_s6_y11_use_complex_sentences_to_communicate_the","ms_s6_y11_use_appropriate_textual_forms_and_struct"],"linkedItems":[]}}},"ms_s6_y11_use_appropriate_textual_forms_and_struct":{"system":{"codename":"ms_s6_y11_use_appropriate_textual_forms_and_struct","collection":"default","id":"bbc9c7e8-c180-460c-be36-30e5689af314","language":"default","lastModified":"2024-09-26T01:47:15.6102178Z","name":"MS S6 Y11 Use appropriate textual forms and structures to communicate information and ideas","sitemapLocations":[],"type":"contentitem","workflowStep":"published"},"elements":{"title":{"images":[],"linkedItemCodenames":[],"linkedItems":[],"links":[],"name":"📜 Title","type":"rich_text","value":"<p>Use appropriate textual forms and structures to communicate information and ideas<\/p>"},"code":{"name":"📜 Code","type":"text","value":""},"including_statements":{"images":[],"linkedItemCodenames":[],"linkedItems":[],"links":[],"name":"📜 Including Statements","type":"rich_text","value":"<p><br
