<script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"data":{"focusArea":{"item":{"system":{"codename":"faa5982718","collection":"default","id":"528e9770-008f-4ec2-b745-26151f9dff6e","language":"default","lastModified":"2026-09-03T06:30:39.0874771Z","name":"MS S6 Y12 Literary worlds","sitemapLocations":[],"type":"focusarea","workflowStep":"published"},"elements":{"outcomes":{"name":"📃 Outcomes","type":"modular_content","value":["oc102523e8","oc643a6a78","ocece1ef5a","ocbe03e3fb","ocd84dd7d0","ocb28b542e"],"linkedItems":[]},"stages__stage_years":{"name":"🏷️ Stage Years","type":"taxonomy","value":[{"name":"12","codename":"n12"}],"taxonomyGroup":"stage_year"},"contentgroups":{"name":"📑 Content Groups","type":"modular_content","value":["cgf2bcec6d","cgb7635454"],"linkedItems":[]},"syllabus_type__items":{"name":"🏷️ Syllabus Type","type":"taxonomy","value":[{"name":"Mainstream","codename":"mainstream"}],"taxonomyGroup":"syllabustype"},"content":{"images":[],"linkedItemCodenames":[],"linkedItems":[],"links":[{"codename":"glo_link__shared__narrative","linkId":"a5d3dd08-32cc-4fc6-812d-6364ce91cf44","urlSlug":"","type":"link_glossary"},{"codename":"glo_link__shared__representation","linkId":"c8e94f63-7f1e-42b4-b519-04266d8ad7d6","urlSlug":"","type":"link_glossary"},{"codename":"glo_link__shared__context","linkId":"b4c39ca8-c656-4fd4-bd65-4e58bec04036","urlSlug":"","type":"link_glossary"},{"codename":"glo_link__shared__form","linkId":"58d91b00-13e7-4f26-b7b1-86611c0aa34c","urlSlug":"","type":"link_glossary"},{"codename":"glo_link__shared__language","linkId":"5ad6016e-bb3f-4521-8d93-ee6e54105e5f","urlSlug":"","type":"link_glossary"},{"codename":"glo_link__en__culture","linkId":"a18e913f-8e09-47e3-8427-b4f270af9016","urlSlug":"","type":"link_glossary"},{"codename":"glo_link__shared__values","linkId":"3d1f27f3-954f-4e45-8c8c-6f09d1c7617b","urlSlug":"","type":"link_glossary"},{"codename":"glo_link__shared__critical","linkId":"d487925c-03cf-4140-a655-08adce5c69a1","urlSlug":"","type":"link_glossary"},{"codename":"glo_link__shared__mode__en_","linkId":"5a642ef7-4687-47ec-b16a-8fb6856d0f5e","urlSlug":"","type":"link_glossary"}],"name":"📜 Content","type":"rich_text","value":"<p>Literary worlds are textual creations of imagination through which a complex relationship is established between author, reader and text. Literary worlds are the <a data-item-id=\"a5d3dd08-32cc-4fc6-812d-6364ce91cf44\" href=\"\">narrative<\/a> <a data-item-id=\"c8e94f63-7f1e-42b4-b519-04266d8ad7d6\" href=\"\">representations<\/a> of people and events; they transcend time and space, and offer depictions that are realistic or metaphoric, possible or fictional, public or private. Students engage with, interpret and experiment with the complex relationship between texts, authors, readers and <a data-item-id=\"b4c39ca8-c656-4fd4-bd65-4e58bec04036\" href=\"\">contexts<\/a>. They explore a range of short texts and extracts from larger works that construct literary worlds.<\/p>\n<p>Students evaluate a range of texts that construct literary worlds. They deepen their understanding of the ideas and ways of thinking represented in texts and how these are shaped by textual <a data-item-id=\"58d91b00-13e7-4f26-b7b1-86611c0aa34c\" href=\"\">forms<\/a> and <a data-item-id=\"5ad6016e-bb3f-4521-8d93-ee6e54105e5f\" href=\"\">language<\/a> features. Students consider aspects of personal, social, <a data-item-id=\"a18e913f-8e09-47e3-8427-b4f270af9016\" href=\"\">cultural<\/a> and historical contexts in their responses to, and compositions of, literary worlds. They examine the ways literary worlds can affirm or challenge their own <a data-item-id=\"3d1f27f3-954f-4e45-8c8c-6f09d1c7617b\" href=\"\">values<\/a> and their assumptions about, and experiences of, the ways texts make meaning.<\/p>\n<p>In their study of literary worlds, students experiment with <a data-item-id=\"d487925c-03cf-4140-a655-08adce5c69a1\" href=\"\">critical<\/a> and creative compositions. They communicate their understanding of the ways literary worlds are constructed to express complex ideas and emotions, motivations, attitudes, experiences and values. These compositions may be realised in various forms, <a data-item-id=\"5a642ef7-4687-47ec-b16a-8fb6856d0f5e\" href=\"\">modes<\/a> and mediums.<\/p>\n<p>Each elective in this focus area involves the study of THREE texts from the prescribed list, with at least TWO of these texts required to be extended print texts, which may include poetry.<\/p>\n<p>Students are also required to study ONE related text for the elective.<\/p>"},"title":{"name":"📜 Title","type":"text","value":"Literary worlds"},"syllabus":{"name":"📒 Syllabus","type":"taxonomy","value":[{"name":"English Extension 11–12 (2024)","codename":"english_extension_11_12_2024"}],"taxonomyGroup":"syllabus"},"prescriptions":{"name":"📖 Prescriptions","type":"modular_content","value":["poa3f7c91e","po5d2b8f4a","poe19c76b3","po7af04d8c","poc8e25f17"],"linkedItems":[]}}},"linkedItems":{"poc8e25f17":{"system":{"codename":"poc8e25f17","collection":"default","id":"a3ab0b60-3ed6-4788-823c-e81bab39b5eb","language":"default","lastModified":"2026-08-28T08:55:19.9568782Z","name":"EE1: Elective 5: Shakespearean worlds","sitemapLocations":[],"type":"prescription_option","workflowStep":"published"},"elements":{"content":{"images":[],"linkedItemCodenames":[],"linkedItems":[],"links":[],"name":"📜 Content","type":"rich_text","value":"<p>In this elective, students consider the nature and characteristics of the worlds of Shakespeare's works. They explore, interrogate and evaluate the ways these worlds can be referenced, reconstructed, extended or subverted in other texts. Students consider the enduring nature of Shakespeare’s work, and the way his work is valued across a range of cultures and contexts. They examine how Shakespeare’s worlds can represent concepts of individualism and subjectivity. In reading and engaging with Shakespearean worlds through texts other than those written by Shakespeare, they will deepen their understanding of the ways structure, ideas, content, and language are adapted and appropriated in new ways. Students evaluate Shakespearean worlds that represent moments of crisis and new ways of understanding the world.&nbsp;&nbsp;<\/p>\n<p>In their responding and composing, students explore, analyse, experiment with, and critically evaluate, their prescribed texts and other appropriate texts. They write imaginative compositions that use textual forms and language to represent Shakespearean worlds.<\/p>\n<p>In this elective, students are required to study THREE of the prescribed texts, which must include at least TWO extended print texts. Students are also required to study ONE related text of their own choosing. Texts can be drawn from a range of contexts and media to explore how Shakespearean worlds have endured.<\/p>"},"title":{"name":"📜 Title","type":"text","value":"Elective 5: Shakespearean worlds"},"prescriptions":{"name":"🗂️ Prescription Groups / Studies","type":"modular_content","value":["extended_print__ee1__elective_5__shakespearean_wor","film_or_media__ee1__elective_5__shakespearean_worl"],"linkedItems":[]}}},"film_or_media__ee1__elective_5__shakespearean_worl":{"system":{"codename":"film_or_media__ee1__elective_5__shakespearean_worl","collection":"default","id":"51e1dc00-f60d-4179-a4a8-91090b46660b","language":"default","lastModified":"2026-08-28T08:55:20.0208764Z","name":"Film or media (EE1: Elective 5: Shakespearean worlds)","sitemapLocations":[],"type":"prescription_group","workflowStep":"published"},"elements":{"title":{"name":"📜 Title","type":"text","value":"Film or media"}}},"extended_print__ee1__elective_5__shakespearean_wor":{"system":{"codename":"extended_print__ee1__elective_5__shakespearean_wor","collection":"default","id":"9ffee6ba-c7e6-4872-bb7b-7adc680ee5f2","language":"default","lastModified":"2026-08-28T08:55:19.9904837Z","name":"Extended print (EE1: Elective 5: Shakespearean worlds)","sitemapLocations":[],"type":"prescription_group","workflowStep":"published"},"elements":{"title":{"name":"📜 Title","type":"text","value":"Extended print"}}},"po7af04d8c":{"system":{"codename":"po7af04d8c","collection":"default","id":"41b20a44-aa7c-406c-b40a-4cee8d76d184","language":"default","lastModified":"2026-08-28T08:55:19.8884729Z","name":"EE1: Elective 4: Natural worlds","sitemapLocations":[],"type":"prescription_option","workflowStep":"published"},"elements":{"content":{"images":[],"linkedItemCodenames":[],"linkedItems":[],"links":[],"name":"📜 Content","type":"rich_text","value":"<p>In this elective, students consider the relationship between literature and the natural environment. By exploring and evaluating natural worlds that can celebrate nature, the wilderness and our place within it, students consider notions of self-renewal and the pastoral. They encounter a range of local and global authors who build literary worlds to show the intersection of culture and nature. Students also consider natural worlds for their beauty and fragility and the role they play in shaping culture, identity and purpose. Students explore texts that represent the relationship between literature and the natural world in a changing ecological context.<\/p>\n<p>In their responding and composing, students explore, analyse, experiment with, and critically evaluate their prescribed texts and other appropriate texts. They write imaginative compositions that use textual forms and language to represent natural worlds.<\/p>\n<p>In this elective, students are required to study THREE of the prescribed texts, which must include at least TWO extended print texts. Students are also required to study ONE related text of their own choosing. Texts can be drawn from a range of contexts and media to explore how texts construct natural worlds to explore the relationship between beauty and fragility.<\/p>"},"title":{"name":"📜 Title","type":"text","value":"Elective 4: Natural worlds"},"prescriptions":{"name":"🗂️ Prescription Groups / Studies","type":"modular_content","value":["extended_print__ee1__elective_4__natural_worlds_"],"linkedItems":[]}}},"extended_print__ee1__elective_4__natural_worlds_":{"system":{"codename":"extended_print__ee1__elective_4__natural_worlds_","collection":"default","id":"fa86fc29-69b7-4528-b05f-15d97e5083ef","language":"default","lastModified":"2026-08-28T08:55:19.9185109Z","name":"Extended print (EE1: Elective 4: Natural worlds)","sitemapLocations":[],"type":"prescription_group","workflowStep":"published"},"elements":{"title":{"name":"📜 Title","type":"text","value":"Extended print"}}},"poe19c76b3":{"system":{"codename":"poe19c76b3","collection":"default","id":"79cdc5bb-d10c-405e-b6a5-1364149e5bdd","language":"default","lastModified":"2026-08-28T08:55:19.7859355Z","name":"EE1: Elective 3: Hybrid worlds","sitemapLocations":[],"type":"prescription_option","workflowStep":"published"},"elements":{"content":{"images":[],"linkedItemCodenames":[],"linkedItems":[],"links":[],"name":"📜 Content","type":"rich_text","value":"<p>In this elective, students consider literary worlds that experiment with and manipulate form and language to explore new possibilities for structure, time and hybridity. They explore and evaluate a range of hybrid literature that can represent notions of exploration, experimentation, vulnerability and exaltation. Students also examine the ways texts call attention to their form and the ways the reader and writer participate in shaping meaning. They explore experimental writing that tests the limits of genre to draw attention to textuality and the way we read.<\/p>\n<p>In their responding and composing, students explore, analyse, experiment with, and critically evaluate their prescribed texts and other appropriate texts. They write imaginative compositions that use textual forms and language to represent hybrid worlds.<\/p>\n<p>In this elective, students are required to study THREE of the prescribed texts, which must include at least TWO extended print texts. Students are also required to study ONE related text of their own choosing. Texts can be drawn from a range of contexts and media to explore how texts construct hybrid worlds to explore new possibilities.<\/p>"},"title":{"name":"📜 Title","type":"text","value":"Elective 3: Hybrid worlds"},"prescriptions":{"name":"🗂️ Prescription Groups / Studies","type":"modular_content","value":["extended_print__ee1__elective_3__hybrid_worlds_","film_or_media__ee1__elective_3__hybrid_worlds_"],"linkedItems":[]}}},"film_or_media__ee1__elective_3__hybrid_worlds_":{"system":{"codename":"film_or_media__ee1__elective_3__hybrid_worlds_","collection":"default","id":"51e80114-049a-4225-a6ae-c4f074eada44","language":"default","lastModified":"2026-08-28T08:55:19.8557975Z","name":"Film or media (EE1: Elective 3: Hybrid worlds)","sitemapLocations":[],"type":"prescription_group","workflowStep":"published"},"elements":{"title":{"name":"📜 Title","type":"text","value":"Film or media"}}},"extended_print__ee1__elective_3__hybrid_worlds_":{"system":{"codename":"extended_print__ee1__elective_3__hybrid_worlds_","collection":"default","id":"22589012-3c97-4d26-9439-78a2f1f4cd94","language":"default","lastModified":"2026-08-28T08:55:19.8251212Z","name":"Extended print (EE1: Elective 3: Hybrid worlds)","sitemapLocations":[],"type":"prescription_group","workflowStep":"published"},"elements":{"title":{"name":"📜 Title","type":"text","value":"Extended print"}}},"po5d2b8f4a":{"system":{"codename":"po5d2b8f4a","collection":"default","id":"4bc230ed-7380-4e60-ae7c-f37c5ee921d5","language":"default","lastModified":"2026-08-28T08:55:19.6897883Z","name":"EE1: Elective 2: Historical worlds","sitemapLocations":[],"type":"prescription_option","workflowStep":"published"},"elements":{"content":{"images":[],"linkedItemCodenames":[],"linkedItems":[],"links":[],"name":"📜 Content","type":"rich_text","value":"<p>In this elective, students consider the interplay between truth and reality in historical worlds. They explore and evaluate the ways historical worlds represent events, periods, and people, shape our understanding of the past, and can challenge notions of bias, authority, legitimacy and truth. Students explore texts that are a representation of the past and texts that use the past to make sense of our time and place. In reading and engaging with historical texts they explore the representation of memory and the relationship between personal and collective experiences. Students critically evaluate the ways historical worlds can represent shifting political, social and cultural values, contexts and attitudes. In reading and engaging with texts students reconsider their own values and assumptions about the past and the ways in which we come to know it.<\/p>\n<p>In their responding and composing, students explore, analyse, experiment with, and critically evaluate their prescribed texts and other appropriate texts. They write imaginative compositions that use textual forms and language to represent historical worlds.<\/p>\n<p>In this elective, students are required to study THREE of the prescribed texts, which must include at least TWO extended print texts. Students are also required to study ONE related text of their own choosing. Texts can be drawn from a range of contexts and media to explore how texts continue to construct and interrogate historical worlds.<\/p>"},"title":{"name":"📜 Title","type":"text","value":"Elective 2: Historical worlds"},"prescriptions":{"name":"🗂️ Prescription Groups / Studies","type":"modular_content","value":["extended_print__ee1__elective_2__historical_worlds","film_or_media__ee1__elective_2__historical_worlds_"],"linkedItems":[]}}},"film_or_media__ee1__elective_2__historical_worlds_":{"system":{"codename":"film_or_media__ee1__elective_2__historical_worlds_","collection":"default","id":"f7197c28-a807-4bf9-93ad-e583be8f1a63","language":"default","lastModified":"2026-08-28T08:55:19.7533835Z","name":"Film or media (EE1: Elective 2: Historical worlds)","sitemapLocations":[],"type":"prescription_group","workflowStep":"published"},"elements":{"title":{"name":"📜 Title","type":"text","value":"Film or media"}}},"extended_print__ee1__elective_2__historical_worlds":{"system":{"codename":"extended_print__ee1__elective_2__historical_worlds","collection":"default","id":"c0bf2f11-1810-4c03-a139-68c7797dac8d","language":"default","lastModified":"2026-08-28T08:55:19.7192654Z","name":"Extended print (EE1: Elective 2: Historical worlds)","sitemapLocations":[],"type":"prescription_group","workflowStep":"published"},"elements":{"title":{"name":"📜 Title","type":"text","value":"Extended print"}}},"poa3f7c91e":{"system":{"codename":"poa3f7c91e","collection":"default","id":"8ac5b9f9-6ca1-4bd3-8e83-999184f4f8c3","language":"default","lastModified":"2026-08-28T08:55:19.5927544Z","name":"EE1: Elective 1: Confessional worlds","sitemapLocations":[],"type":"prescription_option","workflowStep":"published"},"elements":{"content":{"images":[],"linkedItemCodenames":[],"linkedItems":[],"links":[],"name":"📜 Content","type":"rich_text","value":"<p>In this elective, students consider the interplay of performance, intimacy and artifice in confessional worlds. They explore and evaluate the construction of voices used in confessional worlds as representations of revelation and evaluate the implications of unreliability, subjectivity and bias. In reading and engaging with texts students explore how the auto-biographical nature of confession challenges, enlightens and personalises significant cultural, historical, and political contexts and can reveal insights about authenticity, identity, memory, and self-representation. Students explore the way writers adapt, reshape, and experiment with textual forms, language features and voice to interact with their socio-cultural contexts. They examine how language can both reveal and conceal an author’s culture, context, and personality.  <\/p>\n<p>In their responding and composing, students explore, analyse, experiment with, and critically evaluate, their prescribed texts and other appropriate texts. They write imaginative compositions that use textual forms and language to represent confessional worlds.<\/p>\n<p>In this elective, students are required to study THREE of the prescribed texts, which must include at least TWO extended print texts. Students are also required to study ONE related text of their own choosing. Texts can be drawn from a range of contexts and media to explore how writers continue to construct and interrogate confessional worlds.<\/p>"},"title":{"name":"📜 Title","type":"text","value":"Elective 1: Confessional worlds"},"prescriptions":{"name":"🗂️ Prescription Groups / Studies","type":"modular_content","value":["extended_print__ee1__elective_1__confessional_worl","film_or_media__ee1__elective_1__confessional_world"],"linkedItems":[]}}},"film_or_media__ee1__elective_1__confessional_world":{"system":{"codename":"film_or_media__ee1__elective_1__confessional_world","collection":"default","id":"1553058c-e229-4f82-9b77-543ff197f6ec","language":"default","lastModified":"2026-08-28T08:55:19.6577406Z","name":"Film or media (EE1: Elective 1: Confessional worlds)","sitemapLocations":[],"type":"prescription_group","workflowStep":"published"},"elements":{"title":{"name":"📜 Title","type":"text","value":"Film or media"}}},"extended_print__ee1__elective_1__confessional_worl":{"system":{"codename":"extended_print__ee1__elective_1__confessional_worl","collection":"default","id":"bc9b94a9-5b14-4157-8510-19b2a43498ae","language":"default","lastModified":"2026-08-28T08:55:19.6246191Z","name":"Extended print (EE1: Elective 1: Confessional worlds)","sitemapLocations":[],"type":"prescription_group","workflowStep":"published"},"elements":{"title":{"name":"📜 Title","type":"text","value":"Extended print"}}},"cgb7635454":{"system":{"codename":"cgb7635454","collection":"default","id":"e8f0c9e8-cfd1-4ed0-afe2-cd0afa622767","language":"default","lastModified":"2024-
